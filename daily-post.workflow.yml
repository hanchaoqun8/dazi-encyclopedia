name: dazi.uk Daily Dispatch (06:00 Kunming · Zhipu only)

on:
  schedule:
    # GitHub Actions cron uses UTC. 22:00 UTC (previous day) = 06:00 Kunming/Beijing.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install opencc-python-reimplemented pillow

      - name: Generate daily content (wiki + knowledge + 2 SEO posts per week)
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_MODEL: glm-4-plus
          GH_TOKEN: ${{ github.token }}
        run: python scripts/daily_post.py

      - name: Validate all articles (fail closed)
        run: python scripts/validate.py

      - name: Build blog.dazi.uk and wiki.dazi.uk
        run: |
          python scripts/build.py
          python scripts/build_wiki.py

      - name: Commit generated files
        run: |
          git config user.name "dazi-bot"
          git config user.email "bot@dazi.local"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "daily: $(date -u +%Y-%m-%d) wiki/knowledge/SEO dispatch"
            git push
          else
            echo "no changes"
          fi

      - name: Deploy blog.dazi.uk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site \
            --project-name=dazi-tea-blog --branch=main --commit-dirty=true

      - name: Deploy wiki.dazi.uk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site_wiki \
            --project-name=wiki-dazi-uk --branch=main --commit-dirty=true
